<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">Recorrido de atención automatizada en WhatsApp</title><desc id="desc">Una consulta inicia el saludo y el menú principal, con tres opciones: alquiler y venta, loteo y administración. Cada recorrido orienta hacia información y contacto con un asesor.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#cbd6df"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#7693a4" stroke-width="1.5"/></marker></defs><rect width="1000" height="740" rx="24" fill="#f4f7f9"/><rect width="1000" height="740" fill="url(#dots)"/><g font-family="Arial, sans-serif"><text x="40" y="45" fill="#64798a" font-size="12" letter-spacing="2">MANYCHAT / WHATSAPP</text><text x="40" y="82" fill="#152c40" font-size="25" font-weight="700">Cada consulta encuentra su camino.</text><g fill="none" stroke="#7693a4" stroke-width="2.5" marker-end="url(#arrow)"><path d="M500 179V218"/><path d="M500 314V345H185V380"/><path d="M500 314V380"/><path d="M500 314V345H815V380"/><path d="M185 466V510"/><path d="M500 466V510"/><path d="M815 466V510"/><path d="M185 584V620H500V650"/><path d="M500 584V650"/><path d="M815 584V620H500"/></g><rect x="350" y="118" width="300" height="61" rx="15" fill="#17394b"/><text x="500" y="145" text-anchor="middle" fill="#c3ded6" font-size="11" letter-spacing="1.5">01 / INICIO</text><text x="500" y="164" text-anchor="middle" fill="white" font-size="16" font-weight="700">Llega un mensaje a WhatsApp</text><rect x="310" y="218" width="380" height="96" rx="16" fill="white" stroke="#b7cbd3"/><text x="500" y="247" text-anchor="middle" fill="#537b79" font-size="11" letter-spacing="1.5">02 / BIENVENIDA</text><text x="500" y="274" text-anchor="middle" fill="#17394b" font-size="20" font-weight="700">¿En qué podemos ayudarte?</text><text x="500" y="296" text-anchor="middle" fill="#697d87" font-size="13">El cliente elige una opción del menú</text><rect x="40" y="380" width="290" height="86" rx="15" fill="#dfebe8" stroke="#b2ccc4"/><text x="60" y="407" fill="#4d7a70" font-size="11">OPCIÓN A</text><text x="60" y="438" fill="#17394b" font-weight="700" font-size="21">Alquiler / venta</text><rect x="40" y="510" width="290" height="74" rx="13" fill="white" stroke="#c6d4db"/><text x="60" y="539" fill="#17394b" font-size="15" font-weight="700">Elegir tipo de propiedad</text><text x="60" y="562" fill="#697d87" font-size="12">Información según la consulta</text><rect x="355" y="380" width="290" height="86" rx="15" fill="#dfebe8" stroke="#b2ccc4"/><text x="375" y="407" fill="#4d7a70" font-size="11">OPCIÓN B</text><text x="375" y="438" fill="#17394b" font-weight="700" font-size="21">Loteo</text><rect x="355" y="510" width="290" height="74" rx="13" fill="white" stroke="#c6d4db"/><text x="375" y="539" fill="#17394b" font-size="15" font-weight="700">Consultar el proyecto</text><text x="375" y="562" fill="#697d87" font-size="12">Información del loteo</text><rect x="670" y="380" width="290" height="86" rx="15" fill="#dfebe8" stroke="#b2ccc4"/><text x="690" y="407" fill="#4d7a70" font-size="11">OPCIÓN C</text><text x="690" y="438" fill="#17394b" font-weight="700" font-size="21">Administración</text><rect x="670" y="510" width="290" height="74" rx="13" fill="white" stroke="#c6d4db"/><text x="690" y="539" fill="#17394b" font-size="15" font-weight="700">Consultar el servicio</text><text x="690" y="562" fill="#697d87" font-size="12">Orientación sobre el servicio</text><rect x="315" y="650" width="370" height="59" rx="15" fill="#17394b"/><text x="500" y="676" text-anchor="middle" fill="#c3ded6" font-size="11" letter-spacing="1">03 / SIGUIENTE PASO</text><text x="500" y="696" text-anchor="middle" fill="white" font-size="16" font-weight="700">Más información y contacto con un asesor</text></g></svg>